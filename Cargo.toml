[workspace]
resolver = "2"
members = ["contracts/venue", "contracts/guard", "contracts/calls", "contracts/tape", "contracts/usdc-mock"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
